<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Management | Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 900px;
            max-width: 95%;
            min-height: 520px;

            background: white;
            border-radius: 20px;

            overflow: hidden;

            box-shadow: 0 20px 50px rgba(0,0,0,0.25);

            display: flex;
        }

        /* LEFT SIDE */

        .login-left {
            width: 50%;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            color: white;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            padding: 40px;

            text-align: center;
        }

        .login-left .icon {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: rgba(255,255,255,0.15);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 45px;

            margin-bottom: 25px;
        }

        .login-left h1 {
            font-size: 32px;
            font-weight: 700;

            margin-bottom: 15px;
        }

        .login-left p {
            font-size: 16px;
            line-height: 1.6;

            opacity: 0.9;
        }

        /* RIGHT SIDE */

        .login-right {
            width: 50%;

            padding: 55px 50px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-title {
            font-size: 30px;
            font-weight: 700;

            color: #222;

            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #777;

            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;
            color: #444;
        }

        .input-group-text {
            background: white;
            border-right: none;
        }

        .form-control {
            height: 50px;

            border-left: none;

            box-shadow: none !important;
        }

        .form-control:focus {
            border-color: #667eea;
        }

        .input-group:focus-within {
            border-radius: 7px;
        }

        .login-btn {
            height: 50px;

            border: none;
            border-radius: 8px;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #7c3aed
            );

            color: white;

            font-size: 16px;
            font-weight: 600;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(79,70,229,0.35);
        }

        .forgot-password {
            text-align: right;

            margin-top: 10px;
            margin-bottom: 25px;
        }

        .forgot-password a {
            text-decoration: none;

            color: #5b50e6;

            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #ffe5e5;

            color: #dc3545;

            padding: 10px 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .logout-message {
            background: #e7f8ed;

            color: #198754;

            padding: 10px 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .footer-text {
            text-align: center;

            margin-top: 25px;

            color: #999;

            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            .login-container {
                flex-direction: column;

                width: 95%;
            }

            .login-left,
            .login-right {
                width: 100%;
            }

            .login-left {
                min-height: 230px;

                padding: 25px;
            }

            .login-left .icon {
                width: 65px;
                height: 65px;

                font-size: 30px;

                margin-bottom: 15px;
            }

            .login-left h1 {
                font-size: 24px;
            }

            .login-left p {
                display: none;
            }

            .login-right {
                padding: 35px 25px;
            }
        }

    </style>

</head>


<body>


<div class="login-container">


    <!-- LEFT -->

    <div class="login-left">

        <div class="icon">
            <i class="bi bi-mortarboard-fill"></i>
        </div>

        <h1>
            Student Management
        </h1>

        <p>
            Manage students, courses and academic
            information easily from one place.
        </p>

        <p>
            <i class="bi bi-shield-check"></i>
            Secure Login
        </p>

    </div>


    <!-- RIGHT -->

    <div class="login-right">

        <h2 class="login-title">
            Welcome Back 👋
        </h2>

        <p class="login-subtitle">
            Login to your account
        </p>


        <!-- ERROR -->

        <div th:if="${param.error}"
             class="error-message">

            <i class="bi bi-exclamation-circle"></i>

            Invalid username or password.

        </div>


        <!-- LOGOUT -->

        <div th:if="${param.logout}"
             class="logout-message">

            <i class="bi bi-check-circle"></i>

            You have been successfully logged out.

        </div>


        <!-- LOGIN FORM -->

        <form th:action="@{/login}"
              method="post">


            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person"></i>

                    </span>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-2">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>

                    <input
                        type="password"
                        name="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        onclick="togglePassword()">

                        <i
                            class="bi bi-eye"
                            id="eyeIcon">
                        </i>

                    </button>

                </div>

            </div>


            <!-- FORGOT PASSWORD -->

            <div class="forgot-password">

                <a href="/reset-password">
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn w-100">

                <i class="bi bi-box-arrow-in-right"></i>

                &nbsp; Login

            </button>


        </form>


        <div class="footer-text">

            Student Management System © 2026

        </div>

    </div>

</div>


<script>

    function togglePassword() {

        const password =
            document.getElementById("password");

        const icon =
            document.getElementById("eyeIcon");


        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("bi-eye");

            icon.classList.add("bi-eye-slash");

        } else {

            password.type = "password";

            icon.classList.remove("bi-eye-slash");

            icon.classList.add("bi-eye");

        }

    }

</script>


</body>

</html>
