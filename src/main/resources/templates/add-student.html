<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Student</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
		<style>
		    body {
		        min-height: 100vh;
		        background: linear-gradient(135deg, rgb(128, 255, 255), #764ba2);
				}
				.student-card {
						    max-width: 950px;
						    margin: auto;
						    padding: 40px;

						    /* Container background */
						    background: linear-gradient(
						        145deg,
						        rgb(192, 192, 192),
						        #eef2ff
						    );

						    border-radius: 24px;

						    /* Border */
						    border: 1px solid rgba(255, 255, 255, 0.8);

						    /* Shadow */
						    box-shadow:
						        0 20px 50px rgba(31, 41, 55, 0.20),
						        0 5px 15px rgba(79, 70, 229, 0.10);

						    /* Smooth effect */
						    transition: all 0.3s ease;
						}

						.student-card:hover {
						    transform: translateY(-3px);

						    box-shadow:
						        0 25px 60px rgba(31, 41, 55, 0.25),
						        0 8px 20px rgba(79, 70, 229, 0.15);
						}

		    
		</style>
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="student-card">

        <h2 class="mb-4">Add Student</h2>

        <form action="/students/add" method="post">

            <div class="mb-3">
                <label>Username</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Name</label>
                <input type="text"
                       name="name"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Course</label>
                <input type="text"
                       name="course"
                       class="form-control"
                       required>
            </div>

            <div class="mb-3">
                <label>Age</label>
                <input type="number"
                       name="age"
                       class="form-control"
                       required>
            </div>

            <button type="submit"
                    class="btn btn-success">
                Add Student
            </button>

            <a href="/home"
               class="btn btn-secondary">
                Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
