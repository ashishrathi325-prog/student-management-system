<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Reset Password</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
		<style>
		    body {
		        min-height: 100vh;
		        background: linear-gradient(135deg, rgb(128, 128, 0), rgb(192, 192, 192));
		    }
			.student-card {
									    max-width: 950px;
									    margin: auto;
									    padding: 40px;

									    /* Container background */
									    background: linear-gradient(
									        145deg,
									        rgb(192, 192, 192),
									        #eef2ff
									    );

									    border-radius: 24px;

									    /* Border */
									    border: 1px solid rgba(255, 255, 255, 0.8);

									    /* Shadow */
									    box-shadow:
									        0 20px 50px rgba(31, 41, 55, 0.20),
									        0 5px 15px rgba(79, 70, 229, 0.10);

									    /* Smooth effect */
									    transition: all 0.3s ease;
									}

									.student-card:hover {
									    transform: translateY(-3px);

									    box-shadow:
									        0 25px 60px rgba(31, 41, 55, 0.25),
									        0 8px 20px rgba(79, 70, 229, 0.15);
									}

		</style>
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="student-card">

                <h2 class="mb-4">
                    Reset Password
                </h2>

                <form action="/reset-password"
                      method="post">

                    <div class="mb-3">

                        <label>Username</label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>New Password</label>

                        <input type="password"
                               name="newPassword"
                               class="form-control"
                               required>

                    </div>

                    <button type="submit"
                            class="btn btn-warning">
                        Reset Password
                    </button>

                    <a href="/login"
                       class="btn btn-secondary">
                        Back to Login
                    </a>
					<div th:if="${message}"
					     class="alert alert-success mt-3"
					     th:text="${message}">
					</div>

					<div th:if="${error}"
					     class="alert alert-danger mt-3"
					     th:text="${error}">
					</div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
