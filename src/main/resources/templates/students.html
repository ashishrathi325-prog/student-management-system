<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Students</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
		<style>
		    body {
		        min-height: 100vh;
		        background: linear-gradient(135deg, #667eea, #764ba2);
		    }
			.student-card {
					    max-width: 950px;
					    margin: auto;
					    padding: 40px;

					    /* Container background */
					    background: linear-gradient(
					        145deg,
					        #ffffff,
					        #eef2ff
					    );

					    border-radius: 24px;

					    /* Border */
					    border: 1px solid rgba(255, 255, 255, 0.8);

					    /* Shadow */
					    box-shadow:
					        0 20px 50px rgba(31, 41, 55, 0.20),
					        0 5px 15px rgba(79, 70, 229, 0.10);

					    /* Smooth effect */
					    transition: all 0.3s ease;
					}

					.student-card:hover {
					    transform: translateY(-3px);

					    box-shadow:
					        0 25px 60px rgba(31, 41, 55, 0.25),
					        0 8px 20px rgba(79, 70, 229, 0.15);
					}

		</style>
		
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="student-card">

        <div class="d-flex justify-content-between mb-3">

            <h2>Student List</h2>

            <a href="/students/add"
               class="btn btn-success">
                + Add Student
            </a>

        </div>

        <table class="table table-bordered table-striped">

            <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Name</th>
                <th>Course</th>
                <th>Age</th>
                <th>Actions</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="student : ${students}">

                <td th:text="${student.sid}"></td>

                <td th:text="${student.username}"></td>

                <td th:text="${student.name}"></td>

                <td th:text="${student.course}"></td>

                <td th:text="${student.age}"></td>

                <td>

                    <a th:href="@{/students/edit/{id}(id=${student.sid})}"
                       class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a th:href="@{/students/delete/{id}(id=${student.sid})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Delete this student?')">
                        Delete
                    </a>

                </td>

            </tr>

            </tbody>

        </table>

        <a href="/home"
           class="btn btn-secondary">
            Back
        </a>

    </div>

</div>

</body>
</html>
